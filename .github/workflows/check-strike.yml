name: Check strike status

on:
  schedule:
    # Cada 15 minutos. GitHub puede demorar la ejecución bajo carga alta,
    # no es un timer exacto.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # GitHub deshabilita los workflows programados tras 60 días sin
      # actividad en el repo. Re-habilitarlo vía API reinicia ese contador.
      - name: Mantener el workflow activo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check-strike.yml/enable"

      - name: Llamar a /api/cron/check-strike
        env:
          HAYPARO_URL: ${{ vars.HAYPARO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$HAYPARO_URL" ]; then
            echo "Falta la variable de repo HAYPARO_URL (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
          curl -sS -f -H "Authorization: Bearer $CRON_SECRET" "$HAYPARO_URL/api/cron/check-strike"
